<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语听读练习</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2045001551536476"
     crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1c1e21;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #2563eb;
    --accent-soft: #eff4ff;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 1px 3px rgba(16, 24, 40, .04);
    --shadow-lift: 0 4px 10px rgba(16, 24, 40, .07), 0 12px 28px rgba(16, 24, 40, .06);
    --navy: #2563eb;    /* 课本音频 */
    --navy-soft: #eff4ff;
    --violet: #7c3aed;  /* 听写工作台 */
    --violet-soft: #f3eeff;
    --amber: #b45309;   /* BBC 精听 */
    --amber-soft: #fdf3e3;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16181d;
      --card: #1e2127;
      --text: #e8eaed;
      --muted: #9aa1ac;
      --line: #2c3038;
      --accent: #6f9dff;
      --accent-soft: #22304d;
      --shadow: none;
      --shadow-lift: none;
      --navy: #6f9dff;
      --navy-soft: #22304d;
      --violet: #b79bff;
      --violet-soft: #2e2743;
      --amber: #e0b070;
      --amber-soft: #3a3024;
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
                 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    -webkit-text-size-adjust: 100%;
    min-height: 100vh;
    padding-bottom: 40px;
  }

  .wrap { max-width: 820px; margin: 0 auto; padding: 56px 16px 24px; }

  header.page { margin-bottom: 28px; }
  header.page h1 { font-size: 28px; letter-spacing: -.02em; }
  header.page p { color: var(--muted); font-size: 15px; margin-top: 8px; }

  /* ---------- 入口卡片 ---------- */

  .cards { display: grid; gap: 14px; }

  .card {
    display: block; position: relative; overflow: hidden;
    background: var(--card); color: inherit; text-decoration: none;
    border: 1px solid var(--line); border-radius: 14px;
    padding: 18px 20px 16px; box-shadow: var(--shadow);
    transition: transform .14s ease, box-shadow .14s ease, border-color .14s ease;
    -webkit-tap-highlight-color: transparent;
  }
  /* 左侧一道彩条，用卡片的强调色 —— 悬停时它加宽，作为“可点”的暗示。 */
  .card::before {
    content: ''; position: absolute; inset: 0 auto 0 0; width: 4px;
    background: var(--tone); transition: width .14s ease;
  }
  .card:hover, .card:focus-visible {
    transform: translateY(-2px);
    border-color: color-mix(in srgb, var(--tone) 45%, var(--line));
    box-shadow: var(--shadow-lift);
    outline: none;
  }
  .card:hover::before, .card:focus-visible::before { width: 6px; }
  .card:focus-visible { box-shadow: var(--shadow-lift), 0 0 0 3px var(--tone-soft); }

  .card.navy   { --tone: var(--navy);   --tone-soft: var(--navy-soft); }
  .card.violet { --tone: var(--violet); --tone-soft: var(--violet-soft); }
  .card.amber  { --tone: var(--amber);  --tone-soft: var(--amber-soft); }

  .card-head { display: flex; align-items: center; gap: 12px; }

  .ico {
    flex: none; width: 38px; height: 38px; border-radius: 11px;
    display: grid; place-items: center;
    background: var(--tone-soft); color: var(--tone);
  }
  .ico svg { width: 19px; height: 19px; display: block; }

  .card-head h2 { font-size: 17px; letter-spacing: -.01em; }

  .card p { color: var(--muted); font-size: 14px; margin: 10px 0 0; }

  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .meta span {
    font-size: 12px; font-weight: 600; color: var(--tone);
    background: var(--tone-soft); border-radius: 999px; padding: 2px 9px;
  }

  /* 右上角的箭头，悬停时右移一点。 */
  .go {
    position: absolute; top: 50%; right: 18px; translate: 0 -50%;
    color: var(--muted); opacity: .7; transition: translate .14s ease, color .14s ease;
  }
  .go svg { width: 16px; height: 16px; display: block; }
  .card:hover .go, .card:focus-visible .go {
    color: var(--tone); opacity: 1; translate: 3px -50%;
  }

  /* 卡片右侧要留出箭头的位置，正文别压到它下面。 */
  .card-head, .card p, .meta { padding-right: 26px; }

  footer.page {
    margin-top: 32px; padding-top: 18px; border-top: 1px solid var(--line);
    color: var(--muted); font-size: 13px;
  }
  footer.page a { color: var(--accent); text-decoration: none; }
  footer.page a:hover { text-decoration: underline; }

  @media (max-width: 460px) {
    .wrap { padding-top: 36px; }
    header.page h1 { font-size: 24px; }
    .card { padding: 16px 16px 14px; }
    .card-head, .card p, .meta { padding-right: 22px; }
    .go { right: 14px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="page">
    <h1>英语听读练习</h1>
    <p>译林版课本音频、逐句听写、BBC 精听。挑一个开始。</p>
  </header>

  <main class="cards">
    <a class="card navy" href="yilin.html">
      <div class="card-head">
        <span class="ico" aria-hidden="true">
          <svg viewBox="0 0 20 20" fill="currentColor"><path d="M5.4 3.6 15.2 10 5.4 16.4Z"/></svg>
        </span>
        <h2>译林版 8A 英语音频</h2>
      </div>
      <p>按单元排列的课本录音、单词表与练习册。点任意一行即可播放，点行尾的铅笔就着这一段做听写。</p>
      <div class="meta"><span>8 个单元</span><span>74 段音频</span></div>
      <span class="go" aria-hidden="true">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4.5 13 10l-5.5 5.5"/></svg>
      </span>
    </a>

    <a class="card violet" href="dictation.html">
      <div class="card-head">
        <span class="ico" aria-hidden="true">
          <svg viewBox="0 0 20 20" fill="currentColor"><path d="M4.2 12.9 12.6 4.5l2.9 2.9-8.4 8.4Z"/><path d="m3.3 16.7 1-3.8 2.9 2.9Z"/></svg>
        </span>
        <h2>听写工作台</h2>
      </div>
      <p>自己带音频和字幕：拖进来或手动选择本地文件，逐句听写、自动批改，最后可以导出报告。</p>
      <div class="meta"><span>上传音频 + 字幕</span><span>逐句精听</span></div>
      <span class="go" aria-hidden="true">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4.5 13 10l-5.5 5.5"/></svg>
      </span>
    </a>

    <a class="card amber" href="dictation.html?audio=BBC/bbc_tae_portable_fan_problems.mp3">
      <div class="card-head">
        <span class="ico" aria-hidden="true">
          <svg viewBox="0 0 20 20" fill="currentColor"><rect x="2.5" y="8" width="2.2" height="4" rx="1.1"/><rect x="6.4" y="5.4" width="2.2" height="9.2" rx="1.1"/><rect x="10.3" y="3" width="2.2" height="14" rx="1.1"/><rect x="14.2" y="6.6" width="2.2" height="6.8" rx="1.1"/></svg>
        </span>
        <h2>BBC 精听 · 便携风扇的烦恼</h2>
      </div>
      <p>BBC 原声一段，已配好字幕，直接进入听写。想换别的段落，把音频丢进 <code>BBC/</code> 再改这里的链接即可。</p>
      <div class="meta"><span>BBC 原声</span><span>字幕已就绪</span></div>
      <span class="go" aria-hidden="true">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4.5 13 10l-5.5 5.5"/></svg>
      </span>
    </a>
  </main>

  <footer class="page">
    音频与字幕都在本仓库里，纯静态页面，离线也能用。源码见
    <a href="https://github.com/zizhouz/zizhouz.github.io">GitHub</a>。
  </footer>
</div>
</body>
</html>
