    <style>:root{--paper:#e8e1ce;--paper-line:#d9cfb6;--ink:#2b241c;--ink-soft:#6b6252;--ink-faint:#9c927d;--reel:#1f4b49;--reel-dark:#153433;--brass:#b8842e;--pencil:#a63a2e;--pencil-tint:#f4dfda;--moss:#4b5e3f;--reel-tint:#dde8e4;--radius:3px;--topbar-h:56px}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}body{background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}button,select,textarea{font-family:inherit}button{color:inherit}button:focus-visible,textarea:focus-visible,select:focus-visible,[role=button]:focus-visible{outline:2px solid var(--reel);outline-offset:2px}
.app{height:100vh;height:100dvh;display:flex;flex-direction:column}.topbar{height:var(--topbar-h);flex-shrink:0;padding:0 20px;padding-top:env(safe-area-inset-top);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--paper-line)}.wordmark,.title,.prompt,.manuscript textarea,.marks,.transcript-page textarea,.review-text,.review-detail-text{font-family:Lora,Georgia,serif}.wordmark{font-size:17px;font-style:italic;font-weight:600;letter-spacing:.2px}
.main{flex:1;min-height:0;overflow:hidden;display:flex;justify-content:center}.page-col{flex:1;min-width:0;max-width:720px;display:flex;flex-direction:column;justify-content:center;padding:clamp(8px,2vh,20px) 20px;gap:clamp(8px,1.6vh,16px);min-height:0}.head{flex-shrink:0}.title{font-size:clamp(21px,3.4vh,26px);font-weight:600;margin:0 0 6px}.subtitle{max-width:480px;color:var(--ink-soft);font-size:13.5px;line-height:1.6;margin:0}.slots{display:flex;flex-direction:column;gap:clamp(10px,2vh,16px);flex-shrink:0}.slot-label{display:flex;align-items:baseline;gap:8px;font-size:13px;font-weight:600;margin-bottom:8px}.req-mark{color:var(--pencil);font-size:11.5px;font-weight:500}.opt-mark{color:var(--ink-faint);font-size:11.5px;font-weight:500}
.dropzone{height:clamp(88px,15vh,120px);border:1.5px dashed var(--paper-line);border-radius:var(--radius);display:flex;align-items:center;gap:16px;padding:0 20px;cursor:pointer;transition:border-color .15s,background .15s}.dropzone:hover,.dropzone.dragging{border-color:var(--reel);background:var(--reel-tint)}.dropzone.filled{border-style:solid;border-color:var(--reel);background:var(--reel-tint)}.reel-icon{flex-shrink:0;color:var(--ink-faint)}.dropzone:hover .reel-icon,.dropzone.filled .reel-icon{color:var(--reel)}.dz-main{color:var(--reel);font-size:14.5px;font-weight:600;margin:0 0 3px;overflow-wrap:anywhere}.dz-sub{color:var(--ink-faint);font-size:12px;margin:0}.dropzone.filled .dz-main{color:var(--ink)}#fileInput{display:none}.transcript-page{height:clamp(88px,15vh,120px);position:relative;background:repeating-linear-gradient(var(--paper) 0 27px,var(--paper-line) 27px 28px);border:1px solid var(--paper-line);border-left:3px solid var(--reel)}.transcript-page textarea{position:absolute;inset:0;width:100%;height:100%;resize:none;border:0;outline:0;background:transparent;color:var(--ink);font-size:15px;line-height:28px;padding:0 16px;caret-color:var(--reel)}.transcript-page textarea::placeholder{color:var(--ink-faint);font-style:italic}
.foot-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0}.material-foot{justify-content:flex-end}.material-status{min-height:18px;margin:0;color:var(--ink-soft);font-size:12px}.material-status.error{color:var(--pencil)}.generate-btn,.check-btn{border:0;border-radius:var(--radius);background:var(--reel);color:#fff;cursor:pointer;font-size:14px;font-weight:500}.generate-btn{display:flex;align-items:center;gap:9px;padding:12px 24px}.generate-btn:hover,.check-btn:hover,.btn-solid-modal:hover{background:var(--reel-dark)}.generate-btn:disabled{background:var(--paper-line);color:var(--ink-faint);cursor:not-allowed}
.gear-wrap{position:relative}.gear-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:1px solid var(--paper-line);border-radius:50%;background:none;color:var(--ink-soft);cursor:pointer;font-size:15px}.gear-btn:hover{border-color:var(--reel);color:var(--reel)}.settings-sheet{position:absolute;z-index:50;top:calc(var(--topbar-h) - 2px);right:-1px;display:none;width:220px;padding:14px;background:var(--paper);border:1px solid var(--paper-line);border-radius:var(--radius);box-shadow:0 6px 18px rgba(43,36,28,.14)}.settings-sheet.open{display:block}.settings-row{display:flex;align-items:center;justify-content:space-between;padding:7px 2px;font-size:13px}.settings-row select{padding:4px 6px;border:1px solid var(--paper-line);border-radius:var(--radius);background:var(--paper);color:var(--ink);font-size:12.5px}.settings-divider{height:1px;margin:6px 0;background:var(--paper-line)}.settings-link{display:block;width:100%;padding:7px 2px;border:0;background:none;text-align:left;cursor:pointer;font-size:13px}.settings-link:hover{color:var(--reel)}
.reel-wrap{flex-shrink:0;padding:10px 0;border-bottom:1px solid var(--paper-line)}.reel-label{display:flex;align-items:baseline;justify-content:space-between;padding:0 20px 7px;color:var(--ink-faint);font-size:11px;font-variant-numeric:tabular-nums}.current-num{color:var(--brass);font-weight:600}.reel{display:flex;align-items:center;gap:3px;padding:0 20px}.reel-seg{flex:1 1 0;min-width:0;padding:5px 0;border:0;background:none;cursor:pointer}.reel-seg-bar{height:3px;border-radius:2px;background:var(--paper-line);transition:background .15s,height .15s}.reel-seg.done .reel-seg-bar{background:var(--reel);opacity:.6}.reel-seg.current .reel-seg-bar{height:5px;background:var(--brass);opacity:1}.reel-seg:hover .reel-seg-bar{background:var(--reel);opacity:1}
.practice-page{gap:clamp(8px,1.6vh,16px)}.prompt{flex-shrink:0;margin:0;color:var(--ink-soft);font-size:clamp(15px,2.2vh,18px);font-style:italic}.session-meta{flex-shrink:0;margin:-8px 0 0;color:var(--ink-faint);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#audio{display:none}.manuscript{position:relative;flex-shrink:0;min-height:clamp(88px,15vh,140px);background:repeating-linear-gradient(var(--paper) 0 31px,var(--paper-line) 31px 32px);border:1px solid var(--paper-line);border-left:3px solid var(--reel)}.manuscript textarea{position:absolute;inset:0;width:100%;height:100%;resize:none;border:0;outline:0;background:transparent;color:var(--ink);font-size:17px;line-height:32px;padding:0 18px;caret-color:var(--reel)}.marks{position:absolute;inset:0;display:none;overflow:hidden;padding:0 18px;color:var(--ink);font-size:17px;line-height:32px}.marks.show{display:block}.mk-strike{position:relative;color:var(--ink-soft)}.mk-strike:after{content:"";position:absolute;top:50%;left:-1px;right:-1px;border-top:1.5px solid var(--pencil);transform:rotate(-1.5deg)}.mk-insert{position:relative;color:var(--pencil);white-space:nowrap}.mk-caret{position:relative;top:-9px;margin-right:1px;color:var(--pencil);font-family:Caveat,cursive;font-size:15px}.mk-word{position:relative;top:-9px;color:var(--pencil);font-family:Caveat,cursive;font-size:19px}.mk-ok{color:var(--moss)}.hint-ok{color:var(--moss)}

    <script>/* ============================================================================
   听写工作台 · 独立版 —— 不依赖后端，不需要服务器，双击本文件即可使用。

   与主站（frontend/src/main.js）的关系：
     · 下方 <<<SPLICE>>> 标记之间的内容由 standalone/src/generate.mjs 在生成时
       逐字取自 frontend/src/main.js，不要在这里编辑 —— 改了会被下次生成覆盖。
       两处必须保持一致的契约：
         - token.type ∈ {'ok','wrong','missing'}；wrong 携带用户写的词，missing 携带参考词
         - 类名 .mk-ok / .mk-strike / .mk-insert > .mk-caret + .mk-word
         - errCount = diffWords(...).filter(t => t.type !== 'ok').length
         - answerIsCorrect / diffWords 都读取 practiceMode.value
     · 其余部分是本文件自己维护的移植代码（删掉了网络层与 SRT/TXT 导出，
       加入了 SRT 解析与两个文件槽位）。
   ============================================================================ */

const materialScreen = document.querySelector('#materialScreen');
const practiceScreen = document.querySelector('#practiceScreen');
const dropzone = document.querySelector('#dropzone');
const fileInput = document.querySelector('#fileInput');
const dzMain = document.querySelector('#dzMain');
const dzSub = document.querySelector('#dzSub');
const srtDropzone = document.querySelector('#srtDropzone');
const srtInput = document.querySelector('#srtInput');
const srtDzMain = document.querySelector('#srtDzMain');
const srtDzSub = document.querySelector('#srtDzSub');
const generateBtn = document.querySelector('#generateBtn');
const materialStatus = document.querySelector('#materialStatus');
const audio = document.querySelector('#audio');
const userInput = document.querySelector('#userInput');
const marksLayer = document.querySelector('#marksLayer');
const hintText = document.querySelector('#hintText');
const checkBtn = document.querySelector('#checkBtn');
const practiceMode = document.querySelector('#practiceMode');
const speedSelect = document.querySelector('#speedSelect');
const scrubTrack = document.querySelector('#scrubTrack');
const scrubFill = document.querySelector('.scrub-fill');
const scrubCurrent = document.querySelector('#scrubCurrent');
const scrubDuration = document.querySelector('#scrubDuration');
const playBtn = document.querySelector('#playBtn');
const prevBtn = document.querySelector('#prevBtn');
const nextBtn = document.querySelector('#nextBtn');
const replayBtn = document.querySelector('#replayBtn');
const sessionMeta = document.querySelector('#sessionMeta');

const state = {
  file: null,
  objectUrl: null,
  audioKey: null,
  lesson: null,
  current: 0,
  reviewPlayingIdx: null,
  reviewPlayTimer: null,
};
let reviewData = [];
let modeChangedBeforeHydration = false;
let progressSaveTimer = null;
let progressSaveChain = Promise.resolve();
let autoAdvanceTimer = null;
// 已解析但尚未开始练习的 SRT 句子。等待音频选定后才由 loadLocalLesson 接管。
let srtCues = [];

const MODE_DB_NAME = 'dictation-workbench-standalone';
const MODE_DB_VERSION = 1;
const MODE_STORE_NAME = 'settings';
const PROGRESS_STORE_NAME = 'progress';
const MODE_KEY = 'practiceMode';

function normalizePracticeMode(value) {
  return value === 'strict' ? 'strict' : 'standard';
}

function openModeDb() {
  return new Promise((resolve, reject) => {
    if (!('indexedDB' in window)) {
      reject(new Error('IndexedDB is unavailable'));
      return;
    }
    const request = window.indexedDB.open(MODE_DB_NAME, MODE_DB_VERSION);
    request.onupgradeneeded = () => {
      if (!request.result.objectStoreNames.contains(MODE_STORE_NAME)) {
        request.result.createObjectStore(MODE_STORE_NAME);
      }
      if (!request.result.objectStoreNames.contains(PROGRESS_STORE_NAME)) {
        // 主站用音频的 SHA-256 当键，算它要把整个音频读进内存；这里改用
        // 「文件名:大小:修改时间」，代价为零，本地两个文件场景下足够唯一。
        request.result.createObjectStore(PROGRESS_STORE_NAME, { keyPath: 'audioKey' });
      }
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error || new Error('IndexedDB open failed'));
  });
}

async function readPracticeMode() {
  const db = await openModeDb();
  return new Promise((resolve, reject) => {
    const transaction = db.transaction(MODE_STORE_NAME, 'readonly');
    const request = transaction.objectStore(MODE_STORE_NAME).get(MODE_KEY);
    request.onsuccess = () => {
      db.close();
      resolve(normalizePracticeMode(request.result));
    };
    request.onerror = () => {
      db.close();
      reject(request.error || new Error('IndexedDB read failed'));
    };
  });
}

async function savePracticeMode(value) {
  const db = await openModeDb();
  return new Promise((resolve, reject) => {
    const transaction = db.transaction(MODE_STORE_NAME, 'readwrite');
    transaction.objectStore(MODE_STORE_NAME).put(normalizePracticeMode(value), MODE_KEY);
    transaction.oncomplete = () => {
      db.close();
      resolve();
    };
    transaction.onerror = () => {
      db.close();
      reject(transaction.error || new Error('IndexedDB write failed'));
    };
  });
}

function progressRowSnapshot(row) {
  return {
    text: row.text,
    status: row.status,
    checked: row.checked,
    userText: row.userText,
    errCount: row.errCount,
  };
}

function currentProgressSnapshot() {
  if (!state.audioKey || !state.lesson) return null;
  return {
    audioKey: state.audioKey,
    current: state.current,
    reviewData: reviewData.map(progressRowSnapshot),
    updatedAt: Date.now(),
  };
}

async function readLessonProgress(audioKey) {
  const db = await openModeDb();
  return new Promise((resolve, reject) => {
    const transaction = db.transaction(PROGRESS_STORE_NAME, 'readonly');
    const request = transaction.objectStore(PROGRESS_STORE_NAME).get(audioKey);
    request.onsuccess = () => {
      db.close();
      resolve(request.result || null);
    };
    request.onerror = () => {
      db.close();
      reject(request.error || new Error('IndexedDB progress read failed'));
    };
  });
}

async function saveLessonProgress(snapshot) {
  if (!snapshot) return;
  const db = await openModeDb();
  return new Promise((resolve, reject) => {
    const transaction = db.transaction(PROGRESS_STORE_NAME, 'readwrite');
    transaction.objectStore(PROGRESS_STORE_NAME).put(snapshot);
    transaction.oncomplete = () => {
      db.close();
      resolve();
    };
    transaction.onerror = () => {
      db.close();
      reject(transaction.error || new Error('IndexedDB progress write failed'));
    };
  });
}

function queueProgressSave() {
  const snapshot = currentProgressSnapshot();
  if (!snapshot) return;
  progressSaveChain = progressSaveChain
    .catch(() => {})
    .then(() => saveLessonProgress(snapshot))
    .catch(() => {
      // 存储不可用（例如 file:// 下 Chrome 禁用 IndexedDB）时，练习会话照常可用。
    });
}

function scheduleProgressSave() {
  if (progressSaveTimer) window.clearTimeout(progressSaveTimer);
  progressSaveTimer = window.setTimeout(() => {
    progressSaveTimer = null;
    queueProgressSave();
  }, 150);
}

async function hydratePracticeMode() {
  try {
    const savedMode = await readPracticeMode();
    if (!modeChangedBeforeHydration) {
      practiceMode.value = savedMode;
      updateModeHint();
    }
  } catch {
    // 存储不可用时保留 HTML 里的默认值。
  }
}

function updateModeHint() {
  hintText.textContent = practiceMode.value === 'strict'
    ? '严格模式：除首尾空格外须完全一致'
    : '标准模式：忽略大小写与标点';
}

hydratePracticeMode();

function switchScreen(target) {
  materialScreen.style.display = target === 'material' ? 'flex' : 'none';
  practiceScreen.style.display = target === 'practice' ? 'flex' : 'none';
}
window.switchScreen = switchScreen;

function setMaterialStatus(message, error = false) {
  materialStatus.textContent = message;
  materialStatus.classList.toggle('error', error);
}

/* ---------------------------------------------------------------- SRT 解析 */

// 宽容到各轴：可选小时、`.` 或 `,` 小数分隔符、`-->` 两侧任意空白、
// 行尾的 WebVTT 定位参数（捕获后丢弃）。
const SRT_TIMING_RE = /^\s*(?:(\d{1,3}):)?(\d{1,2}):(\d{1,2})[,.](\d{1,3})\s*-->\s*(?:(\d{1,3}):)?(\d{1,2}):(\d{1,2})[,.](\d{1,3})\s*(.*)$/;

function srtTimeToSeconds(hours, minutes, seconds, fraction) {
  // 补齐到毫秒：`.5` 是 500ms，`.57` 是 570ms —— 与后端 _timestamp() 的算法对齐。
  const milliseconds = Number(String(fraction).padEnd(3, '0'));
  return Number(hours || 0) * 3600 + Number(minutes) * 60 + Number(seconds) + milliseconds / 1000;
}

function cleanCueText(line) {
  return line
    // 只清公认的内联标签，不用 /<[^>]+>/ 是为了不误伤 `a < b` 这类正文。
    .replace(/<\/?(?:i|b|u|font)(?:\s[^>]*)?>/gi, '')
    .replace(/\{\\[^}]*\}/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

/**
 * 解析 SRT 文本。纯函数，不碰 DOM，不抛异常。
 * @returns {{cues: Array<{start:number,end:number,text:string}>, warnings: string[], skipped: number}}
 */
function parseSrt(text) {
  const cues = [];
  const warnings = [];
  let skipped = 0;
  let source = String(text ?? '');
  if (source.charCodeAt(0) === 0xfeff) source = source.slice(1);
  source = source.replace(/\r\n?/g, '\n');

  source.split(/\n[ \t]*\n+/).forEach((rawBlock, blockIndex) => {
    const position = blockIndex + 1;
    const lines = rawBlock.split('\n').map((line) => line.replace(/[ \t]+$/, ''));
    while (lines.length && !lines[0].trim()) lines.shift();
    while (lines.length && !lines[lines.length - 1].trim()) lines.pop();
    if (!lines.length) return;

    // 序号行可以缺失，也可以乱序或重复 —— 位置才是顺序，序号一律不信任。
    const body = /^\s*\d+\s*$/.test(lines[0]) ? lines.slice(1) : lines;
    const timing = body.length ? body[0].match(SRT_TIMING_RE) : null;
    if (!timing) {
      warnings.push(`第 ${position} 块的时间行无法解析`);
      skipped += 1;
      return;
    }

    const start = srtTimeToSeconds(timing[1], timing[2], timing[3], timing[4]);
    const end = srtTimeToSeconds(timing[5], timing[6], timing[7], timing[8]);
    // 多行字幕并成一行：换行在单行输入框里无法复现，严格模式会永远判错。
    const cueText = body.slice(1).map(cleanCueText).filter(Boolean).join(' ');

    if (!cueText) {
      warnings.push(`第 ${position} 块没有文字`);
      skipped += 1;
      return;
    }
    if (!(end > start)) {
      warnings.push(`第 ${position} 块的结束时间不晚于开始时间`);
      skipped += 1;
      return;
    }
    if (cues.length && start < cues[cues.length - 1].end) {
      // 只提醒，不改写：逐句播放是「跳转 + 停」，重叠不影响播放，
      // 而静默挪动时间等于篡改用户提供的参考时间且无法撤销。
      warnings.push(`第 ${position} 块与上一句时间重叠`);
    }
    cues.push({ start, end, text: cueText });
  });

  return { cues, warnings, skipped };
}

/* ------------------------------------------------------ 文件选择与拖放 */

const AUDIO_EXTENSIONS = ['mp3', 'm4a', 'aac', 'wav', 'flac', 'ogg', 'opus', 'aiff', 'aif', 'mp4'];
const MAX_SRT_BYTES = 5 * 1024 * 1024;

function classifyFile(file) {
  const name = String(file.name || '').toLowerCase();
  const type = String(file.type || '').toLowerCase();
  if (name.endsWith('.srt') || type === 'application/x-subrip') return 'srt';
  if (type.startsWith('audio/') || AUDIO_EXTENSIONS.includes(name.split('.').pop() || '')) return 'audio';
  return 'unknown';
}

function markAudioSelected(file) {
  if (!file) return;
  state.file = file;
  dropzone.classList.add('filled');
  dzMain.textContent = file.name;
  dzSub.textContent = '点击可重新选择';
  refreshStartButton();
}

async function markSrtSelected(file) {
  if (!file) return;
  if (file.size > MAX_SRT_BYTES) {
    setMaterialStatus('字幕文件过大，可能不是 SRT 文件。', true);
    return;
  }
  let text;
  try {
    text = await file.text();
  } catch {
    setMaterialStatus('字幕文件读取失败，请重新选择。', true);
    return;
  }

  const { cues, warnings, skipped } = parseSrt(text);
  if (warnings.length) console.warn('SRT 解析提示：', warnings);
  if (!cues.length) {
    srtCues = [];
    srtDropzone.classList.remove('filled');
    srtDzMain.textContent = '选择 .srt 字幕文件';
    srtDzSub.textContent = '点击选择 .srt，或拖到这里';
    setMaterialStatus('SRT 中没有解析到可用的字幕行，请检查文件格式。', true);
    refreshStartButton();
    return;
  }

  srtCues = cues;
  srtDropzone.classList.add('filled');
  srtDzMain.textContent = file.name;
  srtDzSub.textContent = skipped ? `${cues.length} 句（略过 ${skipped} 处）` : `${cues.length} 句`;
  const mojibake = cues.some((cue) => cue.text.includes('�'));
  if (mojibake) {
    setMaterialStatus(`已载入 ${cues.length} 句，跳过 ${skipped} 处。字幕文件可能不是 UTF-8 编码，请另存为 UTF-8。`);
  } else if (skipped) {
    setMaterialStatus(`已载入 ${cues.length} 句，跳过 ${skipped} 处无法解析的字幕行。`);
  } else {
    setMaterialStatus('');
  }
  refreshStartButton();
}

function refreshStartButton() {
  generateBtn.disabled = !(state.file && srtCues.length > 0);
}

function assignInput(input, file) {
  try {
    const transfer = new DataTransfer();
    transfer.items.add(file);
    input.files = transfer.files;
  } catch {
    // 浏览器不支持 DataTransfer 构造时，内存里的 File 对象已经够用。
  }
}

// 两个槽位都接受整批拖入：按类型各归各位，所以把音频拖到字幕槽上同样能工作。
function routeDroppedFiles(fileList) {
  const files = Array.from(fileList || []);
  if (!files.length) return;
  const audioFile = files.find((file) => classifyFile(file) === 'audio');
  const srtFile = files.find((file) => classifyFile(file) === 'srt');
  if (audioFile) {
    assignInput(fileInput, audioFile);
    markAudioSelected(audioFile);
  }
  if (srtFile) {
    assignInput(srtInput, srtFile);
    void markSrtSelected(srtFile);
  }
  if (!audioFile && !srtFile) setMaterialStatus('无法识别的文件类型，请选择音频或 .srt 字幕。', true);
}

function wireDropzone(zone) {
  zone.addEventListener('click', () => (zone === dropzone ? fileInput : srtInput).click());
  zone.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      (zone === dropzone ? fileInput : srtInput).click();
    }
  });
  ['dragenter', 'dragover'].forEach((eventName) => zone.addEventListener(eventName, (event) => {
    event.preventDefault();
    zone.classList.add('dragging');
  }));
  zone.addEventListener('dragleave', () => zone.classList.remove('dragging'));
  zone.addEventListener('drop', (event) => {
    event.preventDefault();
    zone.classList.remove('dragging');
    routeDroppedFiles(event.dataTransfer?.files);
  });
}

wireDropzone(dropzone);
wireDropzone(srtDropzone);
fileInput.addEventListener('change', () => markAudioSelected(fileInput.files?.[0]));
srtInput.addEventListener('change', () => void markSrtSelected(srtInput.files?.[0]));

/* ------------------------------------------------------------ 开始练习 */

async function startLesson() {
  if (!state.file || !srtCues.length) return;
  generateBtn.disabled = true;
  setMaterialStatus('');
  try {
    await loadLocalLesson();
  } catch (error) {
    setMaterialStatus(error?.message || '加载失败，请重试。', true);
  } finally {
    refreshStartButton();
  }
}
generateBtn.addEventListener('click', startLesson);

async function loadLocalLesson() {
  const file = state.file;
  if (state.objectUrl) URL.revokeObjectURL(state.objectUrl);
  state.objectUrl = URL.createObjectURL(file);
  state.audioKey = `${file.name}:${file.size}:${file.lastModified}`;
  state.lesson = {
    cues: srtCues,
    transcript: srtCues.map((cue) => cue.text).join(' '),
    duration: null,
  };
  state.current = 0;
  state.reviewPlayingIdx = null;
  reviewData = srtCues.map((cue) => ({
    text: cue.text,
    status: 'pending',
    checked: false,
    userText: '',
    errCount: 0,
  }));
  try {
    await progressSaveChain;
    const savedProgress = await readLessonProgress(state.audioKey);
    if (savedProgress && Array.isArray(savedProgress.reviewData)) {
      reviewData = reviewData.map((row, index) => {
        const savedRow = savedProgress.reviewData[index];
        if (!savedRow || savedRow.text !== row.text) return row;
        return {
          ...row,
          status: savedRow.status === 'ok' || savedRow.status === 'err' ? savedRow.status : 'pending',
          checked: Boolean(savedRow.checked),
          userText: typeof savedRow.userText === 'string' ? savedRow.userText : '',
          errCount: Number.isFinite(Number(savedRow.errCount)) ? Number(savedRow.errCount) : 0,
        };
      });
      state.current = Math.max(0, Math.min(Number(savedProgress.current) || 0, reviewData.length - 1));
    }
  } catch {
    // 存储不可用（例如 file:// 下 Chrome 禁用 IndexedDB）时，新会话照常可用。
  }

  audio.src = state.objectUrl;
  audio.playbackRate = Number(speedSelect.value);
  renderReel();
  updateSessionMeta();
  jumpToSentence(state.current, { persist: false });
  switchScreen('practice');
  // 首句定位必须等元数据就绪：setAudioPosition 在元数据之前赋值 currentTime 会失败，
  // 而它的 try/catch 会把失败吞掉 —— 结果是首句不在 0 秒时按 ▶ 会从头开始播。
  if (audio.readyState === 0) {
    audio.addEventListener('loadedmetadata', onAudioReady, { once: true });
  } else {
    onAudioReady();
  }
  window.setTimeout(() => userInput.focus({ preventScroll: true }), 0);
}

function onAudioReady() {
  state.lesson.duration = audio.duration;
  const cue = activeCue();
  if (cue) setAudioPosition(cue.start);
  updateSessionMeta();
  updateProgress();
}

function updateSessionMeta() {
  if (!state.lesson) return;
  const total = state.lesson.duration;
  const cues = state.lesson.cues;
  const lastEnd = cues.length ? cues[cues.length - 1].end : 0;
  const parts = [state.file?.name || '', `${cues.length} 句`];
  if (Number.isFinite(total)) parts.push(formatClock(total));
  // 典型的「字幕来自另一个剪辑版本」错误，否则在应用内几乎无从诊断。
  if (Number.isFinite(total) && lastEnd > total + 1) parts.push('字幕比音频长');
  sessionMeta.textContent = parts.filter(Boolean).join(' · ');
}

/* ---------------------------------------------------------- 练习主流程 */

function formatClock(seconds) {
  const safe = Math.max(0, Number.isFinite(Number(seconds)) ? Number(seconds) : 0);
  return `${Math.floor(safe / 60)}:${String(Math.floor(safe % 60)).padStart(2, '0')}`;
}

function activeCue() {
  return state.lesson?.cues[state.current] || null;
}

function totalDoneCount() {
  return reviewData.filter((row) => row.checked).length;
}

const reel = document.querySelector('#reel');
const reelCurrentNum = document.querySelector('#reelCurrentNum');
const reelTotalNum = document.querySelector('#reelTotalNum');
const reelDoneLabel = document.querySelector('#reelDoneLabel');

function renderReel() {
  reel.replaceChildren();
  reviewData.forEach((_, index) => {
    const segment = document.createElement('button');
    segment.className = 'reel-seg';
    segment.type = 'button';
    segment.setAttribute('aria-label', `跳转到第 ${index + 1} 句`);
    segment.innerHTML = '<div class="reel-seg-bar"></div>';
    segment.addEventListener('click', () => jumpToSentence(index));
    reel.appendChild(segment);
  });
  // 主站把总数写死在 HTML 里，句子数不是 11 时标签就会撒谎。
  reelTotalNum.textContent = reviewData.length;
}

function persistCurrentAnswer() {
  if (!reviewData[state.current]) return;
  reviewData[state.current].userText = userInput.value;
}

function persistProgressNow() {
  if (progressSaveTimer) {
    window.clearTimeout(progressSaveTimer);
    progressSaveTimer = null;
  }
  persistCurrentAnswer();
  queueProgressSave();
}

function renderAttempt() {
  const row = reviewData[state.current];
  if (!row) return;
  userInput.value = row.userText || '';
  if (row.checked) {
    marksLayer.innerHTML = markupDiff(row.userText, row.text);
    marksLayer.classList.add('show');
    userInput.style.visibility = 'hidden';
    checkBtn.textContent = '重新输入';
    hintText.innerHTML = row.status === 'ok'
      ? '<span class="hint-ok">✓ 回答正确</span>'
      : '<span class="hint-red">删除线</span> = 多写的字 · <span class="hint-red">插入符号</span> = 漏写的字';
  } else {
    marksLayer.classList.remove('show');
    userInput.style.visibility = 'visible';
    checkBtn.textContent = '核对';
    updateModeHint();
  }
}

function focusPracticeField() {
  if (marksLayer.classList.contains('show')) {
    marksLayer.focus({ preventScroll: true });
    return;
  }
  userInput.focus({ preventScroll: true });
}

function setAudioPosition(seconds) {
  if (!audio.src || !Number.isFinite(Number(seconds))) return;
  try { audio.currentTime = Math.max(0, Number(seconds)); } catch { /* 元数据可能还没就绪。 */ }
}

function updateProgress() {
  const cue = activeCue();
  if (!cue) return;
  const total = Math.max(.01, cue.end - cue.start);
  const elapsed = Math.min(total, Math.max(0, (audio.currentTime || cue.start) - cue.start));
  const percentage = Math.min(100, elapsed / total * 100);
  scrubFill.style.width = `${percentage}%`;
  scrubCurrent.textContent = formatClock(elapsed);
  scrubDuration.textContent = formatClock(total);
}

function updatePlayButton() {
  const playing = !audio.paused;
  playBtn.textContent = playing ? '❚❚' : '▶';
  playBtn.setAttribute('aria-label', playing ? '暂停' : '播放本句');
}

function cancelAutoAdvance() {
  if (autoAdvanceTimer === null) return;
  window.clearTimeout(autoAdvanceTimer);
  autoAdvanceTimer = null;
}

async function playCurrentCue() {
  const cue = activeCue();
  if (!cue) return;
  if (audio.currentTime < cue.start || audio.currentTime >= cue.end) setAudioPosition(cue.start);
  try { await audio.play(); } catch { updatePlayButton(); }
}

function jumpToSentence(index, { persist = true, autoplay = false } = {}) {
  if (!reviewData.length) return;
  cancelAutoAdvance();
  if (persist) persistCurrentAnswer();
  state.current = Math.max(0, Math.min(index, reviewData.length - 1));
  const cue = activeCue();
  audio.pause();
  setAudioPosition(cue.start);
  document.querySelectorAll('.reel-seg').forEach((segment, segmentIndex) => {
    segment.classList.toggle('current', segmentIndex === state.current);
    segment.classList.toggle('done', segmentIndex < state.current);
  });
  renderAttempt();
  reelCurrentNum.textContent = state.current + 1;
  reelDoneLabel.textContent = `已完成 ${totalDoneCount()} 句`;
  prevBtn.disabled = state.current === 0;
  nextBtn.disabled = state.current === reviewData.length - 1;
  updateProgress();
  updatePlayButton();
  if (practiceScreen.style.display !== 'none') focusPracticeField();
  if (persist) queueProgressSave();
  if (autoplay) void playCurrentCue();
}
window.jumpToSentence = jumpToSentence;

// ── 拼接区间开始：以下内容逐字来自 frontend/src/main.js，勿在此编辑 ──
function tokenizeWords(text) {
  return text.trim() ? text.trim().split(/\s+/) : [];
}

function standardWord(word) {
  return word.toLowerCase().replace(/[^a-z0-9]/g, '');
}

function normalizedWords(text) {
  return tokenizeWords(text).map(standardWord).filter(Boolean);
}

function answerIsCorrect(answer, expected) {
  if (practiceMode.value === 'strict') return answer.trim() === expected.trim();
  return normalizedWords(answer).join(' ') === normalizedWords(expected).join(' ');
}

function checkCurrentAnswer() {
  const row = reviewData[state.current];
  if (!row) return;
  cancelAutoAdvance();
  if (row.checked) {
    row.checked = false;
    row.status = 'pending';
    renderAttempt();
    userInput.focus({ preventScroll: true });
    queueProgressSave();
    return;
  }
  persistCurrentAnswer();
  row.checked = true;
  row.status = answerIsCorrect(row.userText, row.text) ? 'ok' : 'err';
  row.errCount = diffWords(row.userText, row.text).filter((token) => token.type !== 'ok').length;
  renderAttempt();
  focusPracticeField();
  queueProgressSave();
  if (row.status === 'ok' && state.current < reviewData.length - 1) {
    const checkedIndex = state.current;
    autoAdvanceTimer = window.setTimeout(() => {
      autoAdvanceTimer = null;
      if (state.current !== checkedIndex || !reviewData[checkedIndex]?.checked) return;
      jumpToSentence(checkedIndex + 1, { autoplay: true });
    }, 650);
  }
}
checkBtn.addEventListener('click', checkCurrentAnswer);
marksLayer.addEventListener('click', () => {
  if (!marksLayer.classList.contains('show')) return;
  checkCurrentAnswer();
  focusPracticeField();
});
marksLayer.addEventListener('keydown', (event) => {
  if (event.key !== ' ') return;
  event.preventDefault();
  checkCurrentAnswer();
  focusPracticeField();
});
userInput.addEventListener('input', () => {
  const row = reviewData[state.current];
  if (!row) return;
  row.userText = userInput.value;
  row.checked = false;
  row.status = 'pending';
  scheduleProgressSave();
});
practiceMode.addEventListener('change', () => {
  modeChangedBeforeHydration = true;
  void savePracticeMode(practiceMode.value).catch(() => {
    // Keep the selected mode active for this session if storage is unavailable.
  });
  if (reviewData[state.current]?.checked) {
    const row = reviewData[state.current];
    row.status = answerIsCorrect(row.userText, row.text) ? 'ok' : 'err';
    row.errCount = diffWords(row.userText, row.text).filter((token) => token.type !== 'ok').length;
  }
  renderAttempt();
  queueProgressSave();
});

function diffWords(userText, originalText) {
  const strict = practiceMode.value === 'strict';
  const toTokens = (text) => tokenizeWords(text)
    .map((word) => ({ word, key: strict ? word : standardWord(word) }))
    .filter((token) => strict || token.key);
  const given = toTokens(userText);
  const expected = toTokens(originalText);
  const sameWord = (givenToken, expectedToken) => givenToken.key === expectedToken.key;
  const dp = Array.from({ length: given.length + 1 }, () => new Array(expected.length + 1).fill(0));
  for (let i = given.length - 1; i >= 0; i -= 1) {
    for (let j = expected.length - 1; j >= 0; j -= 1) {
      dp[i][j] = sameWord(given[i], expected[j])
        ? dp[i + 1][j + 1] + 1
        : Math.max(dp[i + 1][j], dp[i][j + 1]);
    }
  }
  const result = [];
  let i = 0;
  let j = 0;
  while (i < given.length && j < expected.length) {
    if (sameWord(given[i], expected[j])) { result.push({ type: 'ok', word: expected[j].word }); i += 1; j += 1; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { result.push({ type: 'wrong', word: given[i].word }); i += 1; }
    else { result.push({ type: 'missing', word: expected[j].word }); j += 1; }
  }
  while (i < given.length) { result.push({ type: 'wrong', word: given[i].word }); i += 1; }
  while (j < expected.length) { result.push({ type: 'missing', word: expected[j].word }); j += 1; }
  return result;
}

function escapeHtml(value) {
  const node = document.createElement('span');
  node.textContent = value;
  return node.innerHTML;
}

function markupDiff(userText, originalText) {
  return diffWords(userText, originalText).map((token) => {
    const word = escapeHtml(token.word);
    if (token.type === 'ok') return `<span class="mk-ok">${word}</span>`;
    if (token.type === 'wrong') return `<span class="mk-strike">${word}</span>`;
    return `<span class="mk-insert"><span class="mk-caret">^</span><span class="mk-word">${word}</span></span>`;
  }).join(' ');
}
// ── 拼接区间结束 ──

playBtn.addEventListener('click', async () => {
  const cue = activeCue();
  if (!cue) return;
  if (audio.paused) {
    await playCurrentCue();
  } else {
    audio.pause();
  }
  focusPracticeField();
});
replayBtn.addEventListener('click', async () => {
  const cue = activeCue();
  if (!cue) return;
  setAudioPosition(cue.start);
  await playCurrentCue();
  focusPracticeField();
});
prevBtn.addEventListener('click', () => jumpToSentence(state.current - 1, { autoplay: true }));
nextBtn.addEventListener('click', () => jumpToSentence(state.current + 1, { autoplay: true }));
speedSelect.addEventListener('change', () => {
  audio.playbackRate = Number(speedSelect.value);
  focusPracticeField();
});
scrubTrack.addEventListener('pointerdown', (event) => {
  const cue = activeCue();
  if (!cue) return;
  const rect = scrubTrack.getBoundingClientRect();
  const fraction = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
  setAudioPosition(cue.start + fraction * (cue.end - cue.start));
  updateProgress();
  focusPracticeField();
});
audio.addEventListener('play', updatePlayButton);
audio.addEventListener('pause', updatePlayButton);
audio.addEventListener('loadedmetadata', updateProgress);
audio.addEventListener('timeupdate', () => {

  if (state.reviewPlayingIdx === null && audio.currentTime >= cue.end) {

});

const gearBtn = document.querySelector('#gearBtn');
const settingsSheet = document.querySelector('#settingsSheet');
gearBtn.addEventListener('click', (event) => {

  const open = settingsSheet.classList.toggle('open');

settingsSheet.addEventListener('click', (event) => event.stopPropagation());
document.addEventListener('click', () => {

  gearBtn.setAttribute('aria-expanded', 'false');
});

function resetMaterial() {
  persistProgressNow();
  audio.pause();
  if (state.objectUrl) URL.revokeObjectURL(state.objectUrl);
  state.file = null;
  state.objectUrl = null;
  state.audioKey = null;
  state.lesson = null;
  srtCues = [];
  reviewData = [];
  fileInput.value = '';
  srtInput.value = '';
  dropzone.classList.remove('filled');
  srtDropzone.classList.remove('filled');
  dzMain.textContent = '选择音频文件';
  dzSub.textContent = '点击选择音频，或拖到这里';

  switchScreen('material');

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') persistProgressNow();
});
window.addEventListener('beforeunload', persistProgressNow);

const reviewOverlay = document.querySelector('#reviewOverlay');
const reviewList = document.querySelector('#reviewList');
const reviewSummary = document.querySelector('#reviewSummary');

document.addEventListener('keydown', (event) => {
  if (event.isComposing || event.repeat || !state.lesson || reviewOverlay.classList.contains('open')) return;
  const key = event.key.toLowerCase();
  const commandKey = event.metaKey || event.ctrlKey;

  if (commandKey && key === 'j') {
    event.preventDefault();
    jumpToSentence(state.current - 1, { autoplay: true });
    return;
  }
  if (commandKey && key === 'k') {
    event.preventDefault();
    replayBtn.click();
    focusPracticeField();
    return;
  }
  if (commandKey && key === 'l') {
    event.preventDefault();
    jumpToSentence(state.current + 1, { autoplay: true });
    return;
  }

  const shouldCheck = commandKey && event.key === 'Enter';
  const shouldReenter = !commandKey
    && event.key === 'Enter'
    && marksLayer.classList.contains('show')
    && !(event.target instanceof HTMLButtonElement);
  if (shouldCheck || shouldReenter) {
    event.preventDefault();
    checkCurrentAnswer();
    if (shouldReenter) userInput.focus({ preventScroll: true });
  }
}, { capture: true });

function stopReviewPlayback() {
  if (state.reviewPlayTimer) window.clearTimeout(state.reviewPlayTimer);
  state.reviewPlayTimer = null;
  state.reviewPlayingIdx = null;
  const button = reviewList.querySelector('.review-play-btn.playing');
  if (button) { button.textContent = '▶'; button.classList.remove('playing'); }
}

async function toggleReviewPlay(index, button) {
  if (state.reviewPlayingIdx === index) {
    stopReviewPlayback();
    audio.pause();
    return;
  }
  stopReviewPlayback();
  const cue = state.lesson?.cues[index];
  if (!cue) return;
  state.reviewPlayingIdx = index;
  button.textContent = '❚❚';
  button.classList.add('playing');
  setAudioPosition(cue.start);
  try { await audio.play(); } catch { /* 自动播放被拦时保留视觉反馈即可。 */ }
  state.reviewPlayTimer = window.setTimeout(() => {
    audio.pause();
    stopReviewPlayback();
  }, Math.max(1800, (cue.end - cue.start) * 1000));
}

function buildReviewList() {
  reviewList.replaceChildren();
  const doneCount = totalDoneCount();
  const okCount = reviewData.filter((row) => row.status === 'ok').length;
  reviewData.forEach((row, index) => {
    const item = document.createElement('div');
    item.className = `review-item${row.status === 'err' ? ' expandable' : ''}`;
    const rowEl = document.createElement('div');
    rowEl.className = 'review-row';
    const number = document.createElement('div');
    number.className = 'review-num';
    number.textContent = index + 1;
    const text = document.createElement('div');
    text.className = 'review-text';
    text.textContent = row.text;
    rowEl.append(number, text);
    if (row.status === 'err') {
      const playButton = document.createElement('button');
      playButton.type = 'button';
      playButton.className = 'review-play-btn';
      playButton.textContent = '▶';
      playButton.setAttribute('aria-label', `重播第 ${index + 1} 句`);
      playButton.addEventListener('click', (event) => { event.stopPropagation(); toggleReviewPlay(index, playButton); });
      rowEl.appendChild(playButton);
    }
    const status = document.createElement('div');
    status.className = `review-status ${row.status === 'ok' ? 'ok' : row.status === 'err' ? 'err' : 'pending'}`;
    status.innerHTML = row.status === 'ok' ? '一次通过' : row.status === 'err' ? `${row.errCount} 处订正 <span class="review-caret">▶</span>` : '未核对';
    rowEl.appendChild(status);
    item.appendChild(rowEl);
    if (row.status === 'err') {
      const detail = document.createElement('div');
      detail.className = 'review-detail';
      detail.innerHTML = `<div class="review-detail-text">${markupDiff(row.userText, row.text)}</div>`;
      item.appendChild(detail);
      rowEl.addEventListener('click', () => item.classList.toggle('open'));
    }
    reviewList.appendChild(item);
  });
  reviewSummary.textContent = `共 ${reviewData.length} 句 · ${okCount} 句一次通过 · 已核对 ${doneCount} 句`;
}

function openReview() {
  if (!state.lesson) return;
  persistCurrentAnswer();
  buildReviewList();
  settingsSheet.classList.remove('open');
  gearBtn.setAttribute('aria-expanded', 'false');
  reviewOverlay.classList.add('open');
}
function closeReview() { stopReviewPlayback(); reviewOverlay.classList.remove('open'); }
document.querySelector('#openReviewLink').addEventListener('click', openReview);
document.querySelector('#reviewClose').addEventListener('click', closeReview);
reviewOverlay.addEventListener('click', (event) => { if (event.target === reviewOverlay) closeReview(); });
document.addEventListener('keydown', (event) => { if (event.key === 'Escape') closeReview(); });

// 导出文件名默认与音频同名：去掉扩展名，并替换文件系统不接受的字符。
function exportBaseName() {
  const base = (state.file?.name || '')
    .replace(/\.[^./\\]+$/, '')
    .replace(/[\\/:*?"<>|]/g, '_')
    .replace(/^[.\s]+|[.\s]+$/g, '');
  return base || 'dictation';
}

// 打印窗口是 about:blank，拿不到任何外部样式表，所以字体从本页内联的那份读回来。
function inlineFontCss() {
  return document.querySelector('#inlineFonts')?.textContent || '';
}

function buildPrintableReport(baseName) {
  const rows = reviewData.map((row, index) => {
    const status = row.status === 'ok' ? '一次通过' : row.status === 'err' ? `${row.errCount} 处订正` : '未核对';
    const detail = row.checked && row.status === 'err'
      ? `<div class="detail">${markupDiff(row.userText, row.text)}</div>`
      : row.checked && row.status === 'ok'
        ? '<div class="correct">✓ 回答正确</div>'
        : '<div class="pending">尚未提交听写</div>';
    return `<section class="report-row"><div class="row-head"><span>第 ${index + 1} 句</span><strong class="${row.status}">${status}</strong></div><p class="original">${escapeHtml(row.text)}</p>${detail}</section>`;
  }).join('');
  // 标题会成为浏览器“另存为 PDF”的默认文件名，因此与音频同名。
  return `<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><title>${escapeHtml(baseName)}</title><style>${inlineFontCss()}
    :root{--paper:#e8e1ce;--line:#d9cfb6;--ink:#2b241c;--muted:#6b6252;--red:#a63a2e;--red-tint:#f4dfda;--green:#4b5e3f}*{box-sizing:border-box}body{margin:0;padding:36px;color:var(--ink);background:var(--paper);font-family:"IBM Plex Sans",sans-serif}.report{max-width:760px;margin:auto}.eyebrow{margin:0 0 6px;color:var(--muted);font-size:12px}.title{margin:0 0 4px;font:600 25px Lora,Georgia,serif}.subtitle{margin:0 0 24px;color:var(--muted);font-size:13px}.report-row{padding:14px 0;border-top:1px solid var(--line);break-inside:avoid}.row-head{display:flex;justify-content:space-between;gap:16px;font-size:13px}.row-head strong{font-size:12px}.row-head .ok{color:var(--green)}.row-head .err{color:var(--red)}.row-head .pending{color:#b8842e}.original{margin:8px 0 0;font:italic 15px/1.6 Lora,Georgia,serif}.detail{margin-top:9px;padding:8px 12px;border-left:2px solid var(--red);background:var(--red-tint);font:15px/26px Lora,Georgia,serif}.correct{margin-top:7px;color:var(--green);font-size:12px}.pending{margin-top:7px;color:var(--muted);font-size:12px}.mk-strike{position:relative;color:var(--muted)}.mk-strike:after{content:"";position:absolute;left:-1px;right:-1px;top:50%;border-top:1.5px solid var(--red);transform:rotate(-1.5deg)}.mk-insert{color:var(--red);white-space:nowrap}.mk-caret{position:relative;top:-9px;margin-right:1px;font:15px Caveat,cursive}.mk-word{position:relative;top:-9px;font:19px Caveat,cursive}.mk-ok{color:var(--green)}@page{size:auto;margin:14mm}@media(max-width:600px){body{padding:20px}.title{font-size:21px}}
  </style></head><body><main class="report"><p class="eyebrow">听写工作台 · 校对与导出</p><h1 class="title">听写校对报告</h1><p class="subtitle">共 ${reviewData.length} 句 · 已核对 ${totalDoneCount()} 句</p>${rows}</main></body></html>`;
}

document.querySelector('#exportPdfBtn').addEventListener('click', () => {
  persistCurrentAnswer();
  const printWindow = window.open('', '_blank');
  if (!printWindow) {
    alert('请允许弹出窗口后再导出 PDF');
    return;
  }
  printWindow.document.open();
  printWindow.document.write(buildPrintableReport(exportBaseName()));
  printWindow.document.close();
  // 监听必须在 close() 之前挂上，并留一个定时兜底：小文档的 load 可能在 close()
  // 返回前就触发过了，那样 print() 永远不会执行，只剩一个空白窗口。printed 去重。
  // close() 推迟到下一个任务，是因为 Firefox 的 print() 不阻塞，立刻关会截断输出。
  let printed = false;
  const print = () => {
    if (printed) return;
    printed = true;
    printWindow.focus();
    printWindow.print();
    window.setTimeout(() => printWindow.close(), 0);
  };
  printWindow.addEventListener('load', print, { once: true });
  window.setTimeout(print, 400);
});
</script>
  </body>
</html>
